name: IRAN Baseline

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q .
      - name: Full pytest
        run: python -m pytest -q
      - name: Unittest discovery
        run: python -m unittest discover -s tests -q
      - name: Runtime evaluation
        run: python evaluation/runtime_suite.py
      - name: CLI smoke
        run: printf '/health\n/exit\n' | python main.py
