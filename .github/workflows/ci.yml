name: IRAN Baseline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q .
      - name: Full pytest
        run: python -m pytest -q
      - name: Unittest discovery
        run: python -m unittest discover -s tests -q
      - name: Rasa foundation tests
        run: python -m pytest -q tests/test_rasa_foundation.py
      - name: Runtime evaluation
        run: python evaluation/runtime_suite.py
      - name: General conversation benchmark
        run: python -m self.general_conversation_benchmark
      - name: CLI smoke
        run: printf '/health\n/exit\n' | python main.py


  live-reviewer-acceptance:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Detect configured live reviewer
        id: key
        shell: bash
        run: |
          if [ -n "$OPENROUTER_API_KEY" ]; then echo "available=true" >> "$GITHUB_OUTPUT"; else echo "available=false" >> "$GITHUB_OUTPUT"; fi
      - name: Install runtime dependencies
        if: steps.key.outputs.available == 'true'
        run: python -m pip install -r requirements.txt
      - name: Live reviewer acceptance chain
        if: steps.key.outputs.available == 'true'
        run: python evaluation/live_reviewer_probe.py
      - name: Record external blocker without weakening gate
        if: steps.key.outputs.available != 'true'
        run: echo "BLOCKED_EXTERNAL OPENROUTER_API_KEY is not configured; learning gate remains fail-closed."
