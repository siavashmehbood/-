name: IRAN Baseline

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q .
      - name: Full pytest
        run: python -m pytest -q
      - name: Unittest discovery
        run: python -m unittest discover -s tests -q
      - name: Rasa foundation unit + black-box runtime acceptance
        run: python -m pytest -q tests/test_rasa_foundation.py tests/test_general_conversation.py
      - name: Semantic intelligence black-box acceptance
        run: python -m pytest -q tests/test_semantic_intelligence.py tests/test_conversation_fact_memory.py tests/test_single_brain_routing.py
      - name: Semantic intelligence performance evidence
        run: python -m self.semantic_intelligence_benchmark
      - name: Soar cognitive foundation real-runtime acceptance
        run: python -m pytest -q tests/test_soar_cognitive_foundation.py tests/test_single_brain_routing.py
      - name: Soar cognitive performance evidence
        run: python -m self.soar_cognitive_benchmark
      - name: Rasa 40-turn CURRENT vs FOUNDATION A-B and performance evidence
        run: python -m self.rasa_foundation_ab
      - name: Runtime evaluation
        run: python evaluation/runtime_suite.py
      - name: General conversation benchmark
        run: python -m self.general_conversation_benchmark
      - name: Validate exact-commit acceptance bundle
        run: python evaluation/build_acceptance_bundle.py
      - name: CLI smoke
        run: printf '/health\n/exit\n' | python main.py


  live-reviewer-status:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record credential availability without exposing it
        id: key
        shell: bash
        run: |
          if [ -n "$OPENROUTER_API_KEY" ]; then echo "available=true" >> "$GITHUB_OUTPUT"; else echo "available=false" >> "$GITHUB_OUTPUT"; fi
      - name: Install runtime dependencies
        if: steps.key.outputs.available == 'true'
        run: python -m pip install -r requirements.txt
      - name: Record live transport result separately from internal acceptance
        shell: bash
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          status = {"state":"BLOCKED_EXTERNAL","reason":"OPENROUTER_API_KEY missing",
                    "human_approval":False,"learning_applied":False}
          if os.environ.get("OPENROUTER_API_KEY", "").strip():
              result = subprocess.run([sys.executable, "evaluation/live_reviewer_probe.py"],
                                      capture_output=True, text=True, timeout=100)
              Path("live-reviewer.log").write_text(result.stdout + result.stderr, encoding="utf-8")
              status["state"] = "TRANSPORT_VERIFIED" if result.returncode == 0 else "BLOCKED_EXTERNAL"
              status["reason"] = "valid live response; no human approval performed" if result.returncode == 0 else "live probe failed; see diagnostic log"
          Path("external-acceptance-status.json").write_text(json.dumps(status, indent=2), encoding="utf-8")
          print(json.dumps(status))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-status-${{ github.sha }}
          path: |
            external-acceptance-status.json
            live-reviewer.log
          if-no-files-found: error
