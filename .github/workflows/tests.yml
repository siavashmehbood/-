name: tests
on:
  push:
    # `*` does not match branch names containing `/`, so the inherited config
    # never fired on push for branches like this one.
    branches: ['**']
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -q
      # Exit code 2 means "below target but limited to the documented known gap",
      # which must not fail the build. Exit code 1 means an unexplained regression.
      - name: Persian conversation audit (regression gate)
        run: python scripts/run_conversation_audit.py || test $? -eq 2
