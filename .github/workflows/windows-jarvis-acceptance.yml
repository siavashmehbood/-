name: Windows Jarvis Acceptance
on:
  workflow_dispatch:
  pull_request:
    branches: [master]
  push:
    branches: [master]
jobs:
  windows-acceptance:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt -r requirements-dev.txt pywinauto
      - name: LearningGate process-lock acceptance
        run: python -m pytest -q tests/test_learning_gate_concurrency.py
      - name: Platform-independent Jarvis integration
        run: python -m pytest -q tests/test_jarvis_integration.py
      - name: Rasa canonical runtime acceptance
        run: python -m pytest -q tests/test_rasa_foundation.py tests/test_general_conversation.py
      - name: Offline conversation memory acceptance
        run: python -m pytest -q tests/test_offline_conversation_memory_acceptance.py
      - name: Semantic intelligence Windows acceptance
        run: python -m pytest -q tests/test_semantic_intelligence.py tests/test_conversation_fact_memory.py tests/test_single_brain_routing.py
      - name: Soar cognitive foundation Windows acceptance
        run: python -m pytest -q tests/test_soar_cognitive_foundation.py
      - name: Final delivery regressions
        run: python -m pytest -q tests/test_final_delivery_regressions.py tests/test_remaining_tool_acceptance.py
      - name: Real Windows acceptance
        run: python -m pytest -q tests/test_windows_jarvis_acceptance.py
      - name: Legacy-regression recovery Windows acceptance
        run: python -m pytest -q tests/test_canonical_conversation_red_team.py tests/test_persian_architecture_contract.py tests/test_review_decision_journal_recovery.py
