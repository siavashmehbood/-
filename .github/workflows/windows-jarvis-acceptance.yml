name: Windows Jarvis Acceptance
on:
  workflow_dispatch:
jobs:
  windows-acceptance:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Platform-independent Jarvis integration
        run: python -m pytest -q tests/test_jarvis_integration.py
      - name: Real Windows acceptance
        run: python -m pytest -q tests/test_windows_jarvis_acceptance.py
