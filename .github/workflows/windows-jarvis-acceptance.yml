name: Windows Jarvis Acceptance
on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - "core/voice.py"
      - "core/computer_use.py"
      - "core/cognitive_pipeline.py"
      - "core/cognitive_system.py"
      - "core/rasa_foundation.py"
      - "runtime/app.py"
      - "learning/missions.py"
      - "core/dialogue.py"
      - "core/conversational_understanding.py"
      - "tools/desktop.py"
      - "tools/builtin.py"
      - "tests/test_jarvis_integration.py"
      - "tests/test_general_conversation.py"
      - "tests/test_rasa_foundation.py"
      - "tests/test_windows_jarvis_acceptance.py"
      - ".github/workflows/windows-jarvis-acceptance.yml"
  push:
    branches: [master]
    paths:
      - "core/voice.py"
      - "core/computer_use.py"
      - "core/cognitive_pipeline.py"
      - "core/cognitive_system.py"
      - "core/rasa_foundation.py"
      - "runtime/app.py"
      - "learning/missions.py"
      - "core/dialogue.py"
      - "core/conversational_understanding.py"
      - "tools/desktop.py"
      - "tools/builtin.py"
      - "tests/test_jarvis_integration.py"
      - "tests/test_general_conversation.py"
      - "tests/test_rasa_foundation.py"
      - "tests/test_windows_jarvis_acceptance.py"
      - ".github/workflows/windows-jarvis-acceptance.yml"
jobs:
  windows-acceptance:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt -r requirements-dev.txt pywinauto
      - name: Platform-independent Jarvis integration
        run: python -m pytest -q tests/test_jarvis_integration.py
      - name: Rasa canonical runtime acceptance
        run: python -m pytest -q tests/test_rasa_foundation.py tests/test_general_conversation.py
      - name: Real Windows acceptance
        run: python -m pytest -q tests/test_windows_jarvis_acceptance.py
